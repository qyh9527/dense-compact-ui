name: check-tools
on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/check.yml
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
