# 技能文件推到 main 后自动发版。
# 默认升 patch；本次推送的提交信息里写 [minor] / [major] 升对应级别，
# 推送的最后一个提交写 [skip release] 则这次不发（改动并入下次发版）。
# 也可以在 Actions 页面手动运行，选择升级级别。
name: release

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - README.md
      - LICENSE
      - references/**
      - assets/**
      - agents/**
  workflow_dispatch:
    inputs:
      bump:
        description: 版本升级级别
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算版本号并生成发布说明
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)

          if [ "$prev" != v0.0.0 ] && [ "$(git rev-list -n 1 "$prev")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD 已经是 $prev，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = push ] && grep -qiF '[skip release]' <<<"$HEAD_MESSAGE"; then
            echo "提交信息要求跳过发版"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$prev" = v0.0.0 ]; then range=HEAD; else range="$prev..HEAD"; fi
          messages=$(git log --format=%B "$range")

          if [ "$EVENT" = workflow_dispatch ]; then
            bump=$INPUT_BUMP
          elif grep -qiF '[major]' <<<"$messages"; then
            bump=major
          elif grep -qiF '[minor]' <<<"$messages"; then
            bump=minor
          else
            bump=patch
          fi

          IFS=. read -r major minor patch <<<"${prev#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"

          {
            echo "## 更新内容"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            if [ "$prev" != v0.0.0 ]; then
              echo "完整差异：https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"
            fi
          } > notes.md

          echo "$prev → $tag（$bump）"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 打包并发布
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=zip --prefix="$name/" -o "$name-$TAG.zip" HEAD
          gh release create "$TAG" "$name-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
