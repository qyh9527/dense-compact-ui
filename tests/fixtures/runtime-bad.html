<!doctype html>
<html lang="zh-CN" class="dc-workbench" data-theme="zinc-graphite-dark">
<head>
<meta charset="utf-8">
<title>运行时探针坏例</title>
<link rel="stylesheet" href="../../assets/tokens.css">
<style>
/* DC014–DC020 的坏例，每个区块注明要触发的规则；对应的合法写法在 runtime-good.html。 */
@font-face {
  font-family: "Missing Brand";
  src: url("./no-such-font.woff2") format("woff2");
}
@font-face {
  font-family: "Missing Icons";
  src: url("./no-such-icons.woff2") format("woff2");
}
html.dc-workbench {
  background: var(--dc-canvas);
  color: var(--dc-text);
}
body {
  margin: 0;
  font: var(--dc-text-body)/var(--dc-line-height) var(--dc-font-sans);
}
main {
  padding: var(--dc-pane-padding);
}
button {
  font: inherit;
  height: var(--dc-control-height);
  padding: 0 var(--dc-space-4);
  color: var(--dc-text);
  border: 1px solid var(--dc-border-control);
  border-radius: var(--dc-radius-control);
  background: transparent;
}
:focus-visible {
  outline: var(--dc-focus-width) solid var(--dc-accent);
  outline-offset: var(--dc-focus-offset);
}

/* DC014：固定宽度的横条把整页撑出横向滚动。 */
.wide {
  width: 1500px;
  height: var(--dc-row-height);
  border-bottom: 1px solid var(--dc-border);
}

/* DC015：按钮贴着 overflow: hidden 容器的左边，焦点环向外 4px 会被裁掉。 */
.clipbox {
  overflow: hidden;
  margin-top: var(--dc-space-5);
}

/* DC016：透明层盖在按钮上。 */
.cover-wrap {
  position: relative;
  display: inline-block;
  margin-top: var(--dc-space-5);
}
.cover {
  position: absolute;
  inset: 0;
}
/* DC016：对话框里的按钮被对话框内部的另一层盖住，浮层豁免不适用。 */
dialog.dlg {
  position: static;
  margin: var(--dc-space-5) 0 0;
  padding: var(--dc-space-3);
  border: 1px solid var(--dc-border);
  background: var(--dc-surface);
  color: var(--dc-text);
}
/* DC016：看起来可用的按钮带 pointer-events: none，点击会穿透。 */
.no-pointer {
  pointer-events: none;
}

/* DC018：同一张不存在的图片用了三次（一次带查询串，报告里合并且不带出查询串），其中一次没写尺寸、塌成 0×0。 */
.thumbs img {
  vertical-align: top;
}

/* DC019：断点或后来的规则把 display 改回 block，gap 与 align-items 不再生效。 */
.toolbar {
  display: flex;
  gap: var(--dc-space-4);
  align-items: center;
}
.toolbar.collapsed {
  display: block;
}

/* DC020：图标字体文件不存在，::before 里的私有区字符显示成方块。 */
.icon::before {
  font-family: "Missing Icons";
  content: "\e900";
}

/* DC017：品牌字体文件不存在，实际回退到后备字体。 */
.brand {
  font-family: "Missing Brand", var(--dc-font-sans);
}
</style>
</head>
<body>
<main>
  <p class="brand">品牌标题文字</p>
  <div class="wide"></div>
  <div class="clipbox"><button id="flush" type="button">贴边按钮</button></div>
  <div class="cover-wrap">
    <button id="covered" type="button">被盖住的按钮</button>
    <div class="cover"></div>
  </div>
  <dialog class="dlg" open>
    <div class="cover-wrap">
      <button id="covered-in-dialog" type="button">对话框里被盖住的按钮</button>
      <div class="cover"></div>
    </div>
  </dialog>
  <button id="no-pointer" class="no-pointer" type="button">点击会穿透的按钮</button>
  <div class="thumbs">
    <img id="broken-1" src="./no-such-image.png" alt="缺失的缩略图一" width="48" height="48">
    <img src="./no-such-image.png?token=secret" alt="缺失的缩略图二" width="48" height="48">
    <img src="./no-such-image.png">
  </div>
  <div id="dead-toolbar" class="toolbar collapsed"><span>筛选</span><span>排序</span></div>
  <p><span id="dead-icon" class="icon" aria-hidden="true"></span><span>设置</span></p>
</main>
</body>
</html>
