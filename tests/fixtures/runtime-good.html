<!doctype html>
<html lang="zh-CN" class="dc-workbench" data-theme="zinc-graphite-dark">
<head>
<meta charset="utf-8">
<title>运行时探针好例</title>
<link rel="stylesheet" href="../../assets/tokens.css">
<style>
/* 与 runtime-bad.html 一一对应的合法写法，DC014–DC020 都不应告警。 */
@font-face {
  font-family: "Unused Brand";
  src: url("./no-such-font.woff2") format("woff2");
}
html.dc-workbench {
  background: var(--dc-canvas);
  color: var(--dc-text);
}
body {
  margin: 0;
  font: var(--dc-text-body)/var(--dc-line-height) var(--dc-font-sans);
}
main {
  padding: var(--dc-pane-padding);
}
button {
  font: inherit;
  height: var(--dc-control-height);
  padding: 0 var(--dc-space-4);
  color: var(--dc-text);
  border: 1px solid var(--dc-border-control);
  border-radius: var(--dc-radius-control);
  background: transparent;
}
:focus-visible {
  outline: var(--dc-focus-width) solid var(--dc-accent);
  outline-offset: var(--dc-focus-offset);
}

/* DC014 好例：宽内容收在自己的横向滚动容器里，页面本身不横向滚动。 */
.scroll-x {
  overflow-x: auto;
}
.scroll-x .wide {
  width: 1500px;
  height: var(--dc-row-height);
  border-bottom: 1px solid var(--dc-border);
}

/* DC015 好例一：裁切容器留出的内边距大于焦点环伸出的 4px。 */
.clipbox {
  overflow: hidden;
  padding: var(--dc-space-3);
  margin-top: var(--dc-space-5);
}
/* DC015 好例二：贴边的滚动列表改用内描边，焦点环不伸出元素。 */
.scroller {
  overflow: auto;
  max-height: 120px;
  margin-top: var(--dc-space-5);
}
.scroller button:focus-visible {
  outline-offset: var(--dc-focus-offset-inset);
}

/* DC016 好例：角标只压住按钮一角；装饰层设了 pointer-events: none；非模态对话框有意盖住下面的按钮。 */
.badge-wrap,
.deco-wrap,
.dialog-host {
  position: relative;
  display: inline-block;
  margin-top: var(--dc-space-5);
}
.badge {
  position: absolute;
  top: -6px;
  right: -6px;
  padding: 0 var(--dc-space-2);
  font-size: var(--dc-text-small);
  border-radius: var(--dc-radius-full);
  background: var(--dc-raised);
}
.deco {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.dialog-host {
  width: 240px;
  height: 80px;
}
.dialog-host dialog {
  position: absolute;
  inset: 0;
  margin: 0;
  padding: var(--dc-space-3);
  border: 1px solid var(--dc-border);
  background: var(--dc-surface);
  color: var(--dc-text);
}

/* DC017 / DC020 好例：声明了但没有元素使用的字体，加载失败也不影响渲染；::before 里的普通字符不算图标。 */
@font-face {
  font-family: "Unused Icons";
  src: url("./no-such-icons.woff2") format("woff2");
}
.chevron::before {
  content: "›";
}

/* DC018 好例：能解码的图片；只有 viewBox 的 SVG；离视口很远、还没触发请求的懒加载图片。 */
.lazy-far {
  margin-top: 6000px;
}

/* DC019 好例：flex 容器里的 gap 与对齐；多列布局的 column-gap 与 justify-content；把对齐重置回默认值。 */
.toolbar {
  display: flex;
  gap: var(--dc-space-4);
  align-items: center;
  margin-top: var(--dc-space-5);
}
.columns {
  column-count: 2;
  column-gap: var(--dc-space-5);
}
.columns.centered {
  column-width: 120px;
  justify-content: center;
}
.reset {
  justify-content: flex-start;
  align-items: stretch;
}
</style>
</head>
<body>
<main>
  <p>普通标题文字</p>
  <div class="scroll-x"><div class="wide"></div></div>
  <div class="clipbox"><button type="button">留白按钮</button></div>
  <div class="scroller">
    <button type="button">列表项一</button>
    <button type="button">列表项二</button>
  </div>
  <span class="badge-wrap"><button type="button">消息</button><span class="badge">3</span></span>
  <span class="deco-wrap"><button type="button">装饰层下的按钮</button><span class="deco"></span></span>
  <div class="dialog-host">
    <button type="button">对话框下的按钮</button>
    <dialog open><button type="button">确定</button></dialog>
  </div>
  <div class="toolbar"><span class="chevron">筛选</span><span>排序</span></div>
  <div class="columns reset"><p>第一栏说明文字</p><p>第二栏说明文字</p></div>
  <div class="columns centered"><p>居中排布的第一栏</p><p>居中排布的第二栏</p></div>
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" width="16" height="16">
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23888'/%3E%3C/svg%3E" alt="" width="16" height="16">
  <img class="lazy-far" src="./no-such-image.png" alt="很远处的懒加载图片" width="48" height="48" loading="lazy">
</main>
</body>
</html>
