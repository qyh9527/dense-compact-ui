<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主题残色坏例</title>
<style>
/* DC021 坏例：页面跟随 prefers-color-scheme 切深浅，但有几处颜色写死了。对应的合法写法在 theme-good.html。 */
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --text: #1f2328;
  --surface: #f6f8fa;
  --border: #d0d7de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191a1b;
    --text: #e6e6e6;
    --surface: #222326;
    --border: #3a3b3f;
  }
}
body {
  margin: 0;
  padding: 12px;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 system-ui, sans-serif;
}
section {
  margin-top: 12px;
}

/* 深色下变成浅色孤岛：背景写死成白色。 */
.legacy-panel {
  height: 160px;
  padding: 12px;
  background: #ffffff;
}

/* 深色下看不清：文字颜色写死成深灰。 */
#hard-dark-text {
  color: #333333;
}

/* 浅色下看不清：文字颜色写死成浅灰。 */
#hard-light-text {
  color: #dddddd;
}
</style>
</head>
<body>
<h1>主题残色</h1>
<section id="legacy" class="legacy-panel"><p>旧版说明面板里的文字</p></section>
<section><p id="hard-dark-text">写死深灰色的说明文字</p></section>
<section><p id="hard-light-text">写死浅灰色的说明文字</p></section>
</body>
</html>
